name: Work with environments

env:
  APP_NAME: "${{ github.repository }}-TEST-APP"
  OWNER: "Ofek"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  job-1:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello World!!!"

      - name: Multiline Command
        run: |
          ls -la
          pwd
          echo "App name: ${{ env.APP_NAME }}, owned by ${{ env.OWNER }}"
          echo "github action: ${{ github.action }}"
          echo "Event: ${{ github.event_name }}"

      - uses: actions/checkout@v4

      - run: ls -la

  job-2:
    runs-on: ubuntu-latest
    needs: ["job-1"]
    env:
      VAR1: "var_1_value"
      VAR2: "var_2_value"
    steps:
      - name: Say Hello
        run: echo "Hello World!!!"

      - name: Multiline Command
        run: |
          ls -la
          pwd
          echo "VAR-1 = ${{ env.VAR1 }}"
          echo "VAR-2 = ${{ env.VAR2 }}"
          echo "App name: ${{ env.APP_NAME }}, owned by ${{ env.OWNER }}"

      - uses: actions/checkout@v4

      - run: ls -la
