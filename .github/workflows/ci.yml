name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check files exist
        run: |
          ls -la
          cat 1.txt
          cat 2.txt
      - name: Save file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-files
          path: 1.txt
          