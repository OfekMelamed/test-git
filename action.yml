name: My Action

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Print Hello
        run: echo "Hello"
      
      - name: Print Ubuntu Version
        run: lsb_release -a
      
      - name: Print SHA
        run: echo SHA - ${{ github.sha }}

  job2:
    runs-on: ubuntu-latest
    needs: [job1]
    steps:
      - uses: actions/checkout@v4
      
      - name: Print files
        run: |
          cat 1.txt
          cat 2.txt
          cat 3.txt
          cat 4.txt
      
      - name: Run test.sh
        run: bash test.sh

  job3:
    runs-on: ubuntu-latest
    needs: [job2]
    env:
      FIRST_NAME: "Ofek"
    steps:
      - name: Print First Name
        run: echo "First Name - ${{ env.FIRST_NAME }}"
      
      - name: Print Last Name
        run: echo "Last Name - $LAST_NAME"
        env:
          LAST_NAME: "Melamed"
      
      - name: Print Phone Number
        run: echo "Phone - ${{ secrets.PHONE_NUMBER }}"